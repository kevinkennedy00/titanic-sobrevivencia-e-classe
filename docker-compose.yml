services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TITANIC_POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${TITANIC_POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${TITANIC_POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - titanic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: ./app/api
    environment:
      DATABASE_URL: postgresql+psycopg://${TITANIC_POSTGRES_USER}:${TITANIC_POSTGRES_PASSWORD}@postgres:5432/${TITANIC_POSTGRES_DB}
      CORS_ORIGINS: ${TITANIC_CORS_ORIGINS}
      DATASET_PATH: /workspace/train.csv
    volumes:
      - ./train.csv:/workspace/train.csv:ro
      - ./06_membros_equipe:/workspace/team:ro
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./app/web
    ports:
      - "127.0.0.1:3011:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  titanic_postgres_data:
