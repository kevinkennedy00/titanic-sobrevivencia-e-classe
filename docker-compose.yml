services:
  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    environment:
      CORS_ORIGINS: ${TITANIC_CORS_ORIGINS:-http://localhost:3011,http://127.0.0.1:3011}
      PORT: 8080
    ports:
      - "127.0.0.1:8086:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./app/web
    ports:
      - "127.0.0.1:3011:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
